<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LangGraph Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 50px auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .chat-header {
      background-color: #343541;
      color: #fff;
      padding: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
    }

    .thread-id {
      background-color: #f8f9fa;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thread-id input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .chat-box {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background-color: #f7f7f8;
      scroll-behavior: smooth;
    }

    .message {
      margin-bottom: 15px;
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
    }

    .user {
      align-self: flex-end;
      background-color: #007bff;
      color: white;
      border-bottom-right-radius: 0;
      text-align: right;
    }

    .bot {
      align-self: flex-start;
      background-color: #e5e5ea;
      color: #111;
      border-bottom-left-radius: 0;
    }

    .chat-form {
      display: flex;
      padding: 15px 20px;
      border-top: 1px solid #ddd;
      background-color: #fff;
    }

    .chat-form input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-right: 10px;
      outline: none;
    }

    .chat-form button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #343541;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    .chat-form button:hover {
      background-color: #2c2f38;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">LangGraph Chatbot</div>

    <div class="thread-id">
      <label for="threadInput"><strong>Thread ID:</strong></label>
      <input type="text" id="threadInput" value="yogesh" placeholder="Enter thread ID..." />
    </div>

    <div class="chat-box" id="chatBox"></div>

    <form id="chatForm" class="chat-form">
      <input type="text" id="userInput" placeholder="Type your message..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const threadInput = document.getElementById('threadInput');

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const message = userInput.value.trim();
      const thread_id = threadInput.value.trim() || "default";

      if (!message) return;

      appendMessage("user", message);
      userInput.value = "";

      try {
        const response = await fetch("http://localhost:8000/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message, thread_id })
        });

        const data = await response.json();
        const reply = data.response || data.error || "Something went wrong!";
        appendMessage("bot", reply);
      } catch (error) {
        appendMessage("bot", "[❌ Error connecting to server]");
      }
    });

    function appendMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
